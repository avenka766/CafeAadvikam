    <!-- Global error handler: catches module-level crashes BEFORE React mounts.
         AUDIT FIX (2026-09-09): moved to an external file (public/error-handler.js)
         so the page's CSP script-src no longer needs 'unsafe-inline'. -->
    <script src="/error-handler.js"></script>
    <!-- SEO (2026-09-30 redesign brief): static JSON-LD, not a per-route
         react-helmet system — this is a single-page marketing site for one
         real business, so one static schema block covers it without adding
         a new runtime dependency. Every fact below is real (see
         src/constants/cafeInfo.ts and the reviews already shown on the page)
         — no invented ratings, awards, or counts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Cafe Aadvikam",
        "image": "https://cafeaadvikam.com/og-image.jpg",
        "url": "https://cafeaadvikam.com/",
        "telephone": "+91 90954 45444",
        "servesCuisine": ["South Indian", "North Indian", "Chinese"],
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "109 Bagalur Main Road",
          "addressLocality": "Berikai",
          "addressRegion": "Tamil Nadu",
          "postalCode": "635105",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "07:00",
          "closes": "22:00"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.6",
          "reviewCount": "57"
        },
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Bakery",
        "name": "Sri Nanjundeshwara Bakery & Sweets",

        "telephone": "+91 90954 45444",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "109 Bagalur Main Road",
          "addressLocality": "Berikai",
          "addressRegion": "Tamil Nadu",
          "postalCode": "635105",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "07:00",
          "closes": "22:00"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.5",
          "reviewCount": "686"
        }
      }
    </script>
    <!-- FAQ schema (brief section 27) — every answer is a fact already
         stated elsewhere on the page (hours, party hall capacity, custom
         cakes, PAN-India status); nothing new is claimed here. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Cafe Aadvikam pure vegetarian?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes, Cafe Aadvikam is a pure vegetarian restaurant serving South Indian, North Indian and Chinese dishes." }
          },
          {
            "@type": "Question",
            "name": "What are Cafe Aadvikam's opening hours?",
            "acceptedAnswer": { "@type": "Answer", "text": "Cafe Aadvikam is open 7 AM to 10 PM, every day of the week." }
          },
          {
            "@type": "Question",
            "name": "Does Cafe Aadvikam have a party hall for events?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes, the in-house party hall is a big hall with ample parking, and outside catering is also available for weddings, corporate events and family functions across Hosur and into Bangalore." }
          },
          {
            "@type": "Question",
            "name": "Can I order a custom cake from Sri Nanjundeshwara Bakery & Sweets?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes, every cake is decorated to order — tell us the flavour, size and design and it's delivered across Hosur and the surrounding area." }
          },
          {
            "@type": "Question",
            "name": "Does Sri Nanjundeshwara Bakery & Sweets deliver pan-India?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes — Sri Nanjundeshwara Bakery & Sweets now delivers bakery and traditional food products pan-India, so you can order the same taste wherever you are." }
          }
        ]
      }
    </script>
    <!-- Product schema (brief section 27) — the two discrete, named
         offerings this business actually sells at a custom (not fixed)
         price, so no "offers.price" is given — schema.org allows a Product
         with no Offer; inventing a price here would be a bigger problem
         than omitting one. Breadcrumb schema was deliberately skipped: this
         is a single-page site with no distinct crawlable sub-pages, so a
         breadcrumb hierarchy wouldn't describe anything real. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Custom Cake — Sri Nanjundeshwara Bakery & Sweets",
        "description": "Cakes decorated to order — any flavour, size and design, delivered across Hosur and the surrounding area.",
        "image": "https://cafeaadvikam.com/cake-gallery/barbie-princess.jpg",
        "brand": { "@type": "Brand", "name": "Sri Nanjundeshwara Bakery & Sweets" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "Ghee Sweets — Sri Nanjundeshwara Bakery & Sweets",
        "description": "Traditional ghee sweets made the traditional way, for celebrations and gifting.",
        "image": "https://cafeaadvikam.com/og-image.jpg",
        "brand": { "@type": "Brand", "name": "Sri Nanjundeshwara Bakery & Sweets" }
      }
    </script>
